server.port=8080
spring.application.name=gateway-service

# --- EUREKA (CONFIGURATION HYBRIDE) ---
# Cette syntaxe permet de marcher en Local (localhost) ET en Docker (via variable d'environnement)
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# --- ZIPKIN / MONITORING ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,prometheus

# --- ROUTAGE AUTOMATIQUE (MAGIE) ---
# Permet de trouver order-service, product-service, etc. automatiquement
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- Securite ---
# Force le passage par ton filtre JWT pour toutes les requetes
spring.cloud.gateway.default-filters[0]=AuthenticationFilter
